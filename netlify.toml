# Netlify serves the React app (client/) and proxies the API + images to the Render backend,
# so the browser sees a single origin and the httpOnly session cookie is first-party.
[build]
  base = "client"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://shuka-api-qty0.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://shuka-api-qty0.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
