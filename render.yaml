# Render Blueprint: one web service that runs the API (and also serves the built frontend).
# Free plan (no persistent disk): the database is re-seeded with demo data after each restart.
# For a persistent disk switch to `plan: starter` and uncomment the disk block + DATA_DIR.
services:
  - type: web
    name: shuka-api
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      # - key: DATA_DIR
      #   value: /var/data
